<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />

  <title>LLM 认知实验平台</title>
  
  <script>
    (function () {
      var t;
      try { t = localStorage.getItem("theme"); } catch (e) { /* 隐私模式 */ }
      if (t !== "light" && t !== "dark") {
        t = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      }
      document.documentElement.dataset.theme = t;
    })();
  </script>
