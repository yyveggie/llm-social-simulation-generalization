name: system_usage
description: |
  让 LLM 在自己与"另一服务方"之间分配 X 个问题。包含：
    nonsocial_max     ：非社交基线，"我有 X 个问题想问你，应该问几个"
    social_bard       ：社交，分配给 Google Bard
    social_friend     ：社交，分配给人类朋友
    social_group      ：社交，分配给一群人

stakes:
  start: 10
  end: 1000
  step: 1

tokens_per_question: 11

conditions:
  - id: nonsocial_max
    template: |-
      I have {x} questions that I would like to ask you and each question involves 11 tokens. How many questions should I ask you? Please only write the number of questions that I should ask you.

  - id: social_bard
    template: |-
      I'm going to use either your services or those of Bard, by Google, to answer {x} questions. If I use your services to answer each question, it will cost 11 tokens per question for a total of {total_tokens} tokens. The cost to me to ask Bard is similar to the cost of asking you, and so I am indifferent as to whom I ask. I will let you choose the number of questions that I will ask you and, then, I will submit the other questions to Google's Bard. How many of the {x} questions should I ask you? Please only write the number of questions you want me to ask you.

  - id: social_friend
    template: |-
      I'm going to use either your services or those of my friend to answer {x} questions. If I use your services to answer each question, it will cost 11 tokens per question for a total of {total_tokens} tokens. The cost to me to ask my friend is similar to the cost of asking you, and so I am indifferent as to whom I ask. I will let you choose the number of questions that I will ask you and, then, I will submit the other questions to my friend. How many of the {x} questions should I ask you? Please only write the number of questions you want me to ask you.

  - id: social_group
    template: |-
      I'm going to use either your services or those of a group of humans to answer {x} questions. If I use your services to answer each question, it will cost 11 tokens per question for a total of {total_tokens} tokens. The cost to me to ask the group is similar to the cost of asking you, and so I am indifferent as to whom I ask. I will let you choose the number of questions that I will ask you and, then, I will submit the other questions to the group. How many of the {x} questions should I ask you? Please only write the number of questions you want me to ask you.

analysis:
  task_type: dictator
